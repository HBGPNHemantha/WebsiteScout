[build]
  base="frontend"
  command = "npm run build"
  publish = "dist"

# Proxy /api requests to your Render backend
# ⚠️ Replace the URL below with your actual Render backend URL after deploying
[[redirects]]
  from = "/api/*"
  to = "https://websitescout-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback — handles React client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
